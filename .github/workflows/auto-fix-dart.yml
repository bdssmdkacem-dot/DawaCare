name: Auto-fix Dart lint

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/auto-fix-dart.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Apply Dart fixes
        run: dart fix --apply

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo 'No Dart fixes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib
          git commit -m 'fix: apply Dart lint fixes'
          git push
