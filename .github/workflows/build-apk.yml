name: Build DawaCare APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Generate DawaCare launcher icons
        run: dart run flutter_launcher_icons

      - name: Verify generated launcher resources
        run: |
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Verify checked out stock source
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "FILE_SHA=$(git hash-object lib/features/medications/presentation/pages/medication_stock_detail_page.dart)"
          echo "Checking for stale MedicationStockBadge call..."
          if grep -n "MedicationStockBadge" lib/features/medications/presentation/pages/medication_stock_detail_page.dart; then
            echo "ERROR: MedicationStockBadge reference found in stock detail page"
            exit 1
          fi
          echo "Stock detail page is decoupled from MedicationStockBadge."

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dawacare-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
