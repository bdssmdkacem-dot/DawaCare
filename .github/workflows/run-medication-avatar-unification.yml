name: Run medication avatar unification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-medication-avatar-unification.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run one-shot unification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          workflow = Path('.github/workflows/medication-avatar-unify-once.yml').read_text(encoding='utf-8')
          start = workflow.index("          python3 - <<'PY") + len("          python3 - <<'PY\n")
          end = workflow.index("          PY", start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace(
              "p.unlink()",
              "p.unlink()\n          Path('.github/workflows/run-medication-avatar-unification.yml').unlink()",
          )
          script = script.replace(
              "subprocess.run(['git', 'rm', '.github/workflows/medication-avatar-unify-once.yml'], check=False)",
              "subprocess.run(['git', 'add', '-u', '.github/workflows'], check=True)",
          )
          subprocess.run(['python3', '-c', script], check=True)
          PY
