include: package:flutter_lints/flutter.yaml

# The personal-account branch no longer exposes the legacy health workflows.
# Keep the old source isolated while the non-health product is finalized.
analyzer:
  exclude:
    - lib/features/patient/**
    - lib/features/medications/**
    - lib/features/doses/**
    - lib/features/caregiver/**
    - lib/features/messages/**

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_print: true
