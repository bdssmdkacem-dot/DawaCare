include: package:flutter_lints/flutter.yaml

# The personal-account branch no longer exposes the legacy health workflows.
# Keep old health/messaging implementation isolated while the non-health
# product is finalized.
analyzer:
  exclude:
    - lib/features/patient/**
    - lib/features/medications/**
    - lib/features/doses/**
    - lib/features/caregiver/**
    - lib/features/messages/**
    - lib/core/notifications/push_notification_service.dart
    - lib/core/voice/voice_message_service.dart

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_print: true
